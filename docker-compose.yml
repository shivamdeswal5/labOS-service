services:
  # Postgres DB Service (for local development)
  database:
    image: postgres:16-alpine
    container_name: labos-database
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - labos-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend Service
  backend:
    container_name: labos-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: npm run start:dev
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - labos-network
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  labos-network:
    name: labos-network
    driver: bridge

volumes:
  pg_data: {}
